name: Release unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Archive (Unsigned)
        run: |
          PROJ_FILE=$(ls -d *.xcodeproj | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          
          echo "Building Archive for $PROJ_FILE using scheme: $SCHEME_NAME"

          xcodebuild archive \
            -project "$PROJ_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -archivePath build/GestaltEdit.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/GestaltEdit.xcarchive/Products/Applications/*.app Payload/
          zip -r GestaltEdit.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestaltEdit-IPA
          path: GestaltEdit.ipa
